[package]
name = "xiao_nrf52840_sword"
version = "0.1.0"
edition = "2021"

[features]
default = []
std = []
# Embedded feature: enables all embedded-specific dependencies
embedded = [
  "embassy-time",
  "embassy-executor",
  "embassy-sync",
  "embassy-futures",
  "defmt",
  "defmt-rtt",
  "panic-probe",
  "lsm6ds3tr",
  "cortex-m-rt",
  "embassy-nrf",
  "linked_list_allocator",
  "static_cell",
  "embedded-storage",
  "nrf-softdevice",
  "nrf-softdevice-s140",
]
# NFC feature: enables NFC pairing/bonding logic (no embedded hardware required)
nfc = []

[[bin]]
name = "xiao_nrf52840_sword"
required-features = ["embedded"]
test = false # Exclude binary from test suite (lib-only tests)

[[test]]
name = "integration_test"
harness = true

[dependencies]
# Core dependencies (lib-usable, std-compatible)
embedded-hal-async = "1.0.0"

[dependencies.embassy-time]
version = "0.5.1"
default-features = false
features = ["defmt"]
optional = true

[dependencies.embassy-executor]
version = "0.10.0"
default-features = false
features = ["platform-cortex-m", "defmt", "executor-interrupt", "executor-thread"]
optional = true

[dependencies.embassy-sync]
version = "0.8.0"
optional = true

[dependencies.embassy-futures]
version = "0.1"
optional = true

[dependencies.defmt]
version = "1.0"
optional = true

[dependencies.defmt-rtt]
version = "1.0"
optional = true

[dependencies.panic-probe]
version = "1.0"
optional = true

[dependencies.lsm6ds3tr]
version = "0.2.2"
optional = true

[dependencies.cortex-m-rt]
version = "0.7.6"
optional = true

[dependencies.embassy-nrf]
version = "0.11.0"
default-features = false
features = ["nrf52840", "gpiote", "time-driver-rtc1"]
optional = true

[dependencies.linked_list_allocator]
version = "0.10.6"
optional = true

[dependencies.static_cell]
version = "2.1"
optional = true

# embedded-storage: NorFlash trait for NVMC flash operations
[dependencies.embedded-storage]
version = "0.3.1"
optional = true

# nrf-softdevice: Pure-Rust async BLE bindings for the nRF52840 S140 SoftDevice.
# Uses git source to get embassy-sync 0.8 compatibility (aligned with our project).
[dependencies.nrf-softdevice]
git = "https://github.com/embassy-rs/nrf-softdevice.git"
default-features = false
features = [
  "nrf52840",
  "s140",
  "ble-peripheral",
  "ble-gatt-server",
  "ble-gatt",
  "defmt",
  "critical-section-impl",
  "macros",
]
optional = true

# S140 SoftDevice FFI bindings (Nordic's pre-compiled BLE stack for nRF52840)
[dependencies.nrf-softdevice-s140]
git = "https://github.com/embassy-rs/nrf-softdevice.git"
optional = true


[profile.release]
opt-level = "s"
lto = false
codegen-units = 1
