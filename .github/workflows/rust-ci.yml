name: Rust CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  host:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy rustfmt llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features nfc -- -D warnings
      - run: cargo check --locked --no-default-features
      - run: cargo test --locked
      - run: cargo test --locked --features nfc
      - run: cargo test --locked --release
      - run: cargo test --locked --release --features nfc
      - run: cargo doc --locked --no-deps --features nfc
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
      - run: cargo test --locked --doc --features nfc
      - uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2
      - run: cargo binstall --no-confirm cargo-tarpaulin@0.37.5
      - run: cargo tarpaulin --locked --features nfc --engine llvm --out Xml --fail-under 95
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cobertura.xml
  firmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add thumbv7em-none-eabihf
      - run: rustup component add llvm-tools-preview clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --locked --release --features embedded --target thumbv7em-none-eabihf
      - run: cargo clippy --locked --features embedded --target thumbv7em-none-eabihf --bin xiao_nrf52840_sword -- -D warnings
      - run: bash scripts/check-firmware.sh
